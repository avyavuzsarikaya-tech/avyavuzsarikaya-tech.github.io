name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - 404.html
      - favicon.svg
      - og.jpg
      - .nojekyll
      - assets/**
      - __grok/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:pages
      - name: Place the site at the repository root
        run: |
          cp dist/client/index.html dist/client/404.html dist/client/.nojekyll dist/client/favicon.svg dist/client/og.jpg .
          rm -rf assets __grok
          cp -a dist/client/assets assets
          if [ -d dist/client/__grok ]; then cp -a dist/client/__grok __grok; fi
          git config user.name "avyavuzsarikaya-tech"
          git config user.email "335169178+avyavuzsarikaya-tech@users.noreply.github.com"
          git add index.html 404.html .nojekyll favicon.svg og.jpg assets __grok
          if git diff --staged --quiet; then
            echo "Site already current"
            exit 0
          fi
          git commit -m "[site] publish"
          git push
