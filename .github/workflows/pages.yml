name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.html"
      - robots.txt
      - sitemap.xml
      - read/**
      - favicon.svg
      - og.jpg
      - .nojekyll
      - assets/**
      - audio/**
      - __grok/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:pages
      - name: Place the site at the repository root
        run: |
          cp dist/client/.nojekyll dist/client/favicon.svg dist/client/og.jpg dist/client/robots.txt dist/client/sitemap.xml .
          # index.html, 404.html and one page per section (climate.html, …); _shell.html stays out.
          for f in dist/client/*.html; do
            case "$(basename "$f")" in _shell.html) ;; *) cp "$f" . ;; esac
          done
          rm -rf assets __grok audio read
          cp -a dist/client/assets assets
          cp -a dist/client/read read
          if [ -d dist/client/__grok ]; then cp -a dist/client/__grok __grok; fi
          if [ -d dist/client/audio ]; then cp -a dist/client/audio audio; fi
          git config user.name "avyavuzsarikaya-tech"
          git config user.email "335169178+avyavuzsarikaya-tech@users.noreply.github.com"
          git add -A .nojekyll favicon.svg og.jpg robots.txt sitemap.xml assets read
          git add -A -- $(cd dist/client && ls *.html | grep -v '^_shell.html$')
          if [ -d __grok ]; then git add -A __grok; fi
          if [ -d audio ]; then git add -A audio; fi
          if git diff --staged --quiet; then
            echo "Site already current"
            exit 0
          fi
          git commit -m "[site] publish"
          git push
